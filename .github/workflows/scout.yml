name: Scout screenshots

on:
  push:
    branches: [main]
    paths: ['sites.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Take screenshots
        run: python scripts/shoot.py sites.txt shots
      - name: Commit screenshots
        run: |
          git config user.name "luex-scout-bot"
          git config user.email "luex-scout-bot@users.noreply.github.com"
          git add shots
          git commit -m "Screenshots for $(head -c 7 <<< "$GITHUB_SHA")" || echo "Nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
